# Все константы бортового ПО. В коде чисел быть не должно.
#
# Это требование регламента 2.5, а не вкусовщина: захардкоженные координаты, тайминги
# вместо детекции и подогнанные под расстановку пороги — формальное основание не засчитать
# попытку. Всё, что здесь лежит, должно объясняться на защите решения (2.7).
#
# Пометка «НЕ ПРОВЕРЕНО» = значение взято из документации, а не измерено на нашем борту.
# Три источника (сайт Geoscan, раздатка организаторов, полевой опыт чужой команды)
# по этим пунктам расходятся. Порядок закрытия:
#   tools/check_sdk.py   — день 1, без полёта: сервопривод, кадр, SoC, методы SDK
#   tools/check_axes.py  — 60 секунд на полигоне: оси и единицы yaw
#
# check_sdk.py прогнан на борту 31.07.2026, закрыты: диапазон сервопривода (-80…+30),
# разрешение кадра (1080x720), чип (rk3576), порт трансляции (8889), дальномер
# (get_dist_sensor_data; модуль Ranger не установлен).
# check_axes.py прогнан там же 31.07.2026, закрыты ОСИ (см. axes ниже).
# Осталось: единицы yaw (тест 3 результата не дал) и угол обзора камеры (калибровка).

hub:
  # Хаб живёт на компьютере оператора. Если все подключены к точке доступа дрона,
  # адрес выдаёт сам дрон — у нашего борта сеть 172.17.49.x, а не 10.42.0.x из
  # документации. Сам борт — 172.17.49.2, этот адрес сюда НЕ подходит.
  # Узнать адрес своей машины (ipconfig / ip addr) и вписать сюда в день 1.
  url: "http://172.17.49.64:5001"  # адрес компьютера оператора, ipconfig от 31.07.2026.
                                   # Меняется при переподключении к сети — сверять перед
                                   # каждой попыткой, это первое, что отваливается
  poll_interval: 0.2               # опрос входящих, с (5 Гц)
  timeout: 0.5                     # таймаут HTTP; больше нельзя — это время в полёте
  retries: 2

axes:
  # Адаптер «наша СК <-> СК автопилота». Наша СК: X вперёд, Y влево, Z вверх (правая).
  # ✅ ПРОВЕРЕНО 31.07.2026 полётом (check_axes.py): первый аргумент go_to_local_point
  # увёл дрон ВПРАВО, второй — ВПЕРЁД. То есть СК автопилота левая (X вправо,
  # Y вперёд), ноль фиксируется в arm() — права раздатка организаторов, а не сайт
  # Geoscan. Пересчёт: sdk_x = -наш_y, sdk_y = наш_x.
  swap_xy: true
  sign_x: -1
  sign_y: 1
  # Единицы yaw противоречат сами себе внутри PDF организаторов: комментарий говорит
  # «в радианах», карточка метода — «в градусах».
  # Тест 3 (31.07.2026) ответа не дал: на yaw=90 дрон НЕ раскрутился — значит это
  # не радианы (90 рад = ~14 оборотов, автопилот бы их отработал), но и поворота
  # на четверть оборота наблюдатель не подтвердил, а get_orientation() курс не
  # изменил (0.11 -> 0.09). Возможно, четвёртый аргумент go_to_local_point на нашем
  # борту просто игнорируется. Оставлено deg как менее опасный вариант.
  # МАРШРУТ ОТ ЭТОГО НЕ ЗАВИСИТ: все точки в survey.py летятся с yaw=0, курс
  # фиксируется в arm() и дальше не меняется. Перепроверять — только если
  # понадобится разворот (наведение на панель курсом вместо смещения).
  yaw_units: deg                   # НЕ ПРОВЕРЕНО (check_axes.py, тест 3 неубедителен): deg | rad
  yaw_sign: 1                      # НЕ ПРОВЕРЕНО: 1, если положительный yaw — против часовой

camera:
  # ✅ ПРОВЕРЕНО 31.07.2026 (check_sdk.py): SDK принимает строго -80…+30,
  # на -85 и -90 отвечает ValueError. Надира не существует — у камеры всегда
  # остаётся ~10° наклона. На высоте 1.5 м это уводит центр кадра на ~26 см,
  # на 2 м — на ~35 см, то есть больше всего порога «<30 см» подзадачи 2.3.2.
  # Матрица R_mount (пункт 2 плана) обязана измеряться ИМЕННО при этом угле.
  servo_angle: -80
  # ✅ ПРОВЕРЕНО: get_cv_frame() отдаёт (720, 1080, 3), uint8, BGR.
  frame_width: 1080
  frame_height: 720
  frame_timeout: 5.0
  viewer_name: main_camera
  drain_frames: 0                  # сколько кадров выбросить перед рабочим (анти-лаг).
                                   # Замерить задержку трансляции на борту и поднять,
                                   # если перцепция работает по прошлому

  intrinsics:
    # ⚠️ НЕ ИЗМЕРЕНО. Пока fx/fy пусты, perception/calib.py считает интринсики
    # по zone.fov_h_deg и громко об этом предупреждает: локализация будет
    # работать, но «<30 см» по ней проверять нельзя.
    # Закрывается за 15 минут БЕЗ ПОЛИГОНА: tools/calibrate_camera.py, шахматка,
    # 20-30 кадров. Скрипт печатает готовый блок — вставить сюда целиком.
    # Списки парсер config.py не поддерживает намеренно, поэтому дисторсия
    # разложена по отдельным ключам, а не вектором из пяти чисел.
    fx: 0.0                        # пиксели
    fy: 0.0
    cx: 0.0                        # ноль = взять середину кадра
    cy: 0.0
    k1: 0.0                        # радиальная дисторсия
    k2: 0.0
    p1: 0.0                        # тангенциальная
    p2: 0.0
    k3: 0.0

  mount:
    # Механический перекос крепления камеры, градусы, в осях корпуса. Измеряется
    # ИМЕННО при servo_angle выше и вместе с ним: постоянный наклон камеры входит
    # в R_mount и вычитается формулой, а забытый — уводит все координаты разом.
    # Способ измерить: положить метку на известном расстоянии перед дроном, снять
    # кадр с рабочим углом сервы, подобрать поправки так, чтобы локализация вернула
    # реальные координаты (tools/replay.py покажет расхождение).
    roll: 0.0                      # НЕ ИЗМЕРЕНО
    pitch: 0.0                     # НЕ ИЗМЕРЕНО
    yaw: 0.0                       # НЕ ИЗМЕРЕНО

  attitude:
    # Знаки углов get_orientation() относительно нашей конвенции (localization.py):
    # положительный roll поднимает левый борт, положительный pitch опускает нос.
    # ⚠️ НЕ ПРОВЕРЕНО на нашем борту. Ошибка знака не падает с исключением — она
    # удваивает вклад крена в ошибку координат (~3.5 см на градус). На рабочей
    # высоте дрон летит почти ровно, поэтому пункт 2 это не блокирует.
    # Закрывается на земле: наклонить дрон рукой и сверить знак get_orientation().
    roll_sign: 1                   # НЕ ПРОВЕРЕНО: 1 или -1
    pitch_sign: 1                  # НЕ ПРОВЕРЕНО: 1 или -1

detector:
  # Чем ищем станции:
  #   classic — тёмный прямоугольник на светлом полу, порог Оцу. Работает без
  #             обученной модели и без NPU. Baseline и страховка
  #   yolo    — обученная модель на NPU борта. Основной путь; если она не поднялась,
  #             код сам падает на classic и говорит об этом
  backend: classic
  model: stations                  # имя модели в реестре борта (http://172.17.49.2:7777)
  conf: 0.25                       # порог уверенности YOLO
  nms: 0.45
  img_size: 640                    # вход модели
  every_n: 3                       # инференс раз в N кадров. Отрисовка и HUD — каждый
                                   # кадр: трансляция обязана оставаться плавной,
                                   # а инференс дорогой (docs/DRONE_PLAN.md §1.3)
  # ⚠️ РАЗМЕР СТАНЦИИ НЕ ИЗМЕРЕН — уточнить у организаторов и переснять перед попыткой.
  # Пороги обязаны бракетировать реальный размер с запасом: слишком узкие потеряют
  # станцию, а «количество обнаруженных соответствует реальному» — условие всех 8 баллов.
  # Площадь считается В МЕТРАХ через высоту и интринсики, а не в пикселях: пиксельный
  # порог поедет с высотой.
  min_area_m2: 0.03                # НЕ ИЗМЕРЕНО: меньше — это мусор на полу
  max_area_m2: 1.20                # НЕ ИЗМЕРЕНО: больше — это тень или разметка
  aspect_max: 4.0                  # длинная сторона к короткой; панель почти квадрат
  min_pixels: 200                  # отсев шума до дорогих проверок
  close_px: 9                      # морфологическая чистка, пиксели
  # Классический детектор ищет пятно, НЕПОХОЖЕЕ НА ФОН, а не «тёмное». Так он берёт
  # за один проход и тёмную исправную панель, и светлую запылённую (а «покрыта пылью»
  # распознаётся именно по повышенной яркости). Порог Оцу этого не умеет в принципе:
  # он делит кадр ровно надвое.
  #   any    — любое отклонение от фона. Разумный выбор, пока неизвестно, как станция
  #            выглядит на фоне покрытия полигона (на карте организаторов оно тёмное)
  #   dark   — только темнее фона
  #   bright — только светлее фона
  polarity: any
  contrast_sigma: 6.0              # во сколько робастных разбросов фона (MAD) должно
                                   # уложиться отклонение, чтобы стать объектом
  contrast_min: 0.12               # но не меньше этой доли диапазона яркости: на
                                   # идеально однородном полу разброс нулевой, и без
                                   # этого «объектом» становится шум матрицы
  central_frac: 0.5                # в оценку координат идут только наблюдения из
                                   # центральных 50 % кадра (docs/DRONE_PLAN.md §2.2)

fusion:
  # Реестр станций. Условие ВСЕХ 8 баллов подзадачи 2.3.2 — «количество обнаруженных
  # станций соответствует реальному», и оно симметрично: лишняя станция стоит столько
  # же, сколько пропущенная. Отсюда оба порога ниже.
  assoc_radius: 0.40               # м: ближе этого — то же самое, дальше — новая
                                   # станция. Порог обязан быть БОЛЬШЕ нашей точности
                                   # (медиана даёт <10 см) и МЕНЬШЕ реального
                                   # расстояния между станциями. Второе НЕ ИЗМЕРЕНО —
                                   # замерить расстановку на площадке и сверить
  confirm_obs: 3                   # сколько наблюдений до отправки station_new.
                                   # Защита от одиночного ложного срабатывания
  max_obs: 60                      # окно наблюдений на станцию: за длинный полёт
                                   # позиция дрейфует, и старые точки тянут медиану
  status_min_conf: 0.6             # ниже — голоса поделились почти поровну, и слать
                                   # status_update значит мигать статусом на карте
  resend_moved: 0.10               # м: переслать station_new, если уточнённая медиана
                                   # уехала дальше. Первый пакет уходит после трёх
                                   # наблюдений (реальное время — условие 8 баллов),
                                   # но оценивают нас по ИТОГОВОЙ точке на карте,
                                   # а медиана двадцати наблюдений заметно точнее.
                                   # Хаб и визуализатор ведут станции по id, поэтому
                                   # повтор уточняет запись, а не плодит новую.
                                   # 0 — выключить переотправку
  max_stations: 12                 # больше, чем бывает на полигоне (регламент: 3-5).
                                   # Превышение = детектор сыпет ложными, и плодить
                                   # записи молча нельзя

flight:
  h_survey: 1.5                    # рабочая высота облёта, м. Для трассы 2x3 м этого
                                   # достаточно и запас по оптопотоку (0.06-4 м) больше.
                                   # Для змейки по большой зоне поднять до 2.0
  speed: 0.45                      # м/с: при 10 FPS даёт >=20 кадров на станцию
  h_min: 0.35                      # ЖЁСТКИЙ ПОЛ: команда ниже не уходит в автопилот.
                                   # Единственная защита от касания панели (подзадача 2.3.4,
                                   # сломанное оборудование не заменяется)
  h_max: 2.5                       # выше оптопоток срывается
  # ⚠️ ПОРОГИ ПОДНЯТЫ 31.07.2026. check_sdk.py показал на покоящемся борту 8.2 В —
  # это батарея 2S (7.4 В номинал, 8.4 В заряженная), а не 1S из документации Geoscan.
  # Со старыми порогами 6.6/6.2 (это 3.3 и 3.1 В на банку) защита не сработала бы
  # никогда: дрон упал бы раньше. Сейчас 3.5 и 3.3 В на банку.
  # УТОЧНИТЬ по логам первых полётов: снять напряжение в момент, когда дрон реально
  # начинает проседать, и поставить порог на 0.2 В выше.
  batt_low: 7.0                    # В: порог аварийного возврата
  batt_critical: 6.6               # В: немедленная посадка
  point_timeout: 25.0              # с на перелёт между точками
  settle: 1.0                      # с паузы после прихода в точку
  arm_settle: 3.0                  # arm(timeout=5) сам по себе стоит ~5 с
  takeoff_settle: 3.0

route:
  # Форма маршрута:
  #   loop   — обход трассы по четырём угловым точкам (основной режим, секция loop)
  #   survey — змейка построчно по прямоугольной зоне (секция zone)
  mode: loop

loop:
  # Габариты трассы: дрон обходит её по четырём углам и замыкает круг.
  # Мерить по внешней белой линии овала рулеткой перед попыткой (регламент 2.5:
  # маршрут строится под фактическую расстановку, а не под вчерашнюю).
  length: 3.0                      # НЕ ПРОВЕРЕНО: размер вдоль X (вперёд), м
  width: 2.0                       # НЕ ПРОВЕРЕНО: размер вдоль Y (влево), м
  # Центр контура относительно точки взлёта. Ноль = площадка «H» в середине овала.
  # Если H смещена от центра, замерить сдвиг и вписать сюда со знаком.
  center_x: -0.5                    # НЕ ПРОВЕРЕНО
  center_y: 0.0                    # НЕ ПРОВЕРЕНО
  margin: 0.0                      # раздвинуть контур наружу, м. Отрицательное значение
                                   # заводит маршрут внутрь овала, подальше от сетки
  direction: ccw                   # ccw — против часовой сверху, cw — по часовой
  laps: 1                          # сколько кругов подряд
  use_packet_zone: false           # брать габариты из пакета takeoff вместо этих.
                                   # Выключено: трассу меряем мы, автомобиль её не знает

zone:
  # Используется только при route.mode: survey.
  # Размеры зоны облёта — параметр попытки, а не константа. Уточнить у организаторов
  # (docs/DRONE_PLAN.md, приложение Г) и переснимать перед каждой попыткой.
  width: 6.0                       # м вдоль X (вперёд)
  height: 6.0                      # м вдоль Y (влево)
  margin: 0.4                      # отступ от границы зоны, м
  # Перекрытие соседних полос. ПОДНЯТО с 0.3 до 0.5 под правило центральных 50 %
  # кадра (detector.central_frac): в оценку координат идут только наблюдения из
  # середины кадра, значит рабочая ширина полосы — половина полного следа камеры,
  # и при 0.3 между полосами оставались бы коридоры, где станцию видно только с краю.
  # Она там не потеряется (грубые наблюдения тоже считаются, см. fusion.py), но
  # координата будет держаться на худших наблюдениях — а это 4 балла.
  # Цена: змейка примерно на 40 % длиннее.
  overlap: 0.5
  fov_h_deg: 60.0                  # НЕ ПРОВЕРЕНО: горизонтальный угол обзора камеры.
                                   # Считается из интринсик после калибровки (пункт 2)
  strip_axis: auto                 # вдоль какой оси идут проходы: auto | x | y.
                                   # auto = вдоль длинной стороны: меньше разворотов,
                                   # меньше времени и расхода батареи
  # Центр зоны относительно точки взлёта. По умолчанию (параметр не задан) центр
  # смещён вперёд на полширины — дрон стартует у ближнего края зоны. Если площадка
  # окажется в середине зоны, поставить center_x: 0.0
  center_y: 0.0

map:
  # Привязка карты визуализатора. Пример организаторов (source/2_step/MapExample.py)
  # рисует станции в ПИКСЕЛЯХ картинки полигона и координаты их просто захардкодил;
  # у нас они приходят от дрона в метрах, поэтому нужна привязка.
  #
  # Как измерить, один раз на площадке (10 минут, полигон не нужен):
  #   1. взять на картинке две точки с известным расстоянием между ними — например,
  #      углы посадочной площадки или ширину трассы, — и поделить пиксели на метры;
  #   2. отметить пиксель, в котором на картинке стоит дрон в момент взлёта;
  #   3. если ось X дрона (вперёд по курсу старта) не смотрит вверх по картинке —
  #      вписать поворот в градусах, против часовой.
  image: "assets/map.jpg"          # относительно распределительный хаб/
  px_per_m: 100.0                  # НЕ ИЗМЕРЕНО
  origin_px_x: 594                 # НЕ ИЗМЕРЕНО: середина картинки 1188x900
  origin_px_y: 450                 # НЕ ИЗМЕРЕНО
  yaw_deg: 0.0                     # НЕ ИЗМЕРЕНО

mission:
  src: drone
  # Какая подзадача регламента сдаётся. Профили — в квадрокоптер/tasks.py, здесь только
  # выбор; ключ --task у main.py и launch.py перекрывает это значение.
  #   2.3.1  взлёт по команде, облёт, посадка. Детекции нет вообще
  #   2.3.2  + обнаружение станций, station_new и recon_done
  #   2.3.3  + отправка status_update
  #   2.3.4  наведение на запылённую станцию (задел пункта 4, манёвр ещё не написан)
  # По умолчанию 2.3.1: пункт 1 ещё не проверен полётом, и до этого момента поведение
  # по умолчанию менять нельзя.
  task: "2.3.1"
  manual_start: false              # true — не ждать пакет takeoff (отладка без хаба)
  telemetry_hz: 2.0
  survey_timeout: 420.0            # с на весь облёт
  return_timeout: 90.0
  land_timeout: 45.0
  record: true
  record_dir: "."                  # на борту: /home/pioneermini/workspace
  record_fps: 15
