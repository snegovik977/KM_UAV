# Все константы бортового ПО. В коде чисел быть не должно.
#
# Это требование регламента 2.5, а не вкусовщина: захардкоженные координаты, тайминги
# вместо детекции и подогнанные под расстановку пороги — формальное основание не засчитать
# попытку. Всё, что здесь лежит, должно объясняться на защите решения (2.7).
#
# Пометка «НЕ ПРОВЕРЕНО» = значение взято из документации, а не измерено на нашем борту.
# Три источника (сайт Geoscan, раздатка организаторов, полевой опыт чужой команды)
# по этим пунктам расходятся. Порядок закрытия:
#   tools/check_sdk.py   — день 1, без полёта: сервопривод, кадр, SoC, методы SDK
#   tools/check_axes.py  — 60 секунд на полигоне: оси и единицы yaw
#
# check_sdk.py прогнан на борту 31.07.2026, закрыты: диапазон сервопривода (-80…+30),
# разрешение кадра (1080x720), чип (rk3576), порт трансляции (8889), дальномер
# (get_dist_sensor_data; модуль Ranger не установлен).
# check_axes.py прогнан там же 31.07.2026, закрыты ОСИ (см. axes ниже).
# Осталось: единицы yaw (тест 3 результата не дал) и угол обзора камеры (калибровка).

hub:
  # Хаб живёт на компьютере оператора. Если все подключены к точке доступа дрона,
  # адрес выдаёт сам дрон — у нашего борта сеть 172.17.49.x, а не 10.42.0.x из
  # документации. Сам борт — 172.17.49.2, этот адрес сюда НЕ подходит.
  # Узнать адрес своей машины (ipconfig / ip addr) и вписать сюда в день 1.
  url: "http://172.17.49.64:5001"  # адрес компьютера оператора, ipconfig от 31.07.2026.
                                   # Меняется при переподключении к сети — сверять перед
                                   # каждой попыткой, это первое, что отваливается
  poll_interval: 0.2               # опрос входящих, с (5 Гц)
  timeout: 0.5                     # таймаут HTTP; больше нельзя — это время в полёте
  retries: 2

axes:
  # Адаптер «наша СК <-> СК автопилота». Наша СК: X вперёд, Y влево, Z вверх (правая).
  # ✅ ПРОВЕРЕНО 31.07.2026 полётом (check_axes.py): первый аргумент go_to_local_point
  # увёл дрон ВПРАВО, второй — ВПЕРЁД. То есть СК автопилота левая (X вправо,
  # Y вперёд), ноль фиксируется в arm() — права раздатка организаторов, а не сайт
  # Geoscan. Пересчёт: sdk_x = -наш_y, sdk_y = наш_x.
  swap_xy: true
  sign_x: -1
  sign_y: 1
  # Единицы yaw противоречат сами себе внутри PDF организаторов: комментарий говорит
  # «в радианах», карточка метода — «в градусах».
  # Тест 3 (31.07.2026) ответа не дал: на yaw=90 дрон НЕ раскрутился — значит это
  # не радианы (90 рад = ~14 оборотов, автопилот бы их отработал), но и поворота
  # на четверть оборота наблюдатель не подтвердил, а get_orientation() курс не
  # изменил (0.11 -> 0.09). Возможно, четвёртый аргумент go_to_local_point на нашем
  # борту просто игнорируется. Оставлено deg как менее опасный вариант.
  # МАРШРУТ ОТ ЭТОГО НЕ ЗАВИСИТ: все точки в survey.py летятся с yaw=0, курс
  # фиксируется в arm() и дальше не меняется. Перепроверять — только если
  # понадобится разворот (наведение на панель курсом вместо смещения).
  yaw_units: deg                   # НЕ ПРОВЕРЕНО (check_axes.py, тест 3 неубедителен): deg | rad
  yaw_sign: 1                      # НЕ ПРОВЕРЕНО: 1, если положительный yaw — против часовой

camera:
  # ✅ ПРОВЕРЕНО 31.07.2026 (check_sdk.py): SDK принимает строго -80…+30,
  # на -85 и -90 отвечает ValueError. Надира не существует — у камеры всегда
  # остаётся ~10° наклона. На высоте 1.5 м это уводит центр кадра на ~26 см,
  # на 2 м — на ~35 см, то есть больше всего порога «<30 см» подзадачи 2.3.2.
  # Матрица R_mount (пункт 2 плана) обязана измеряться ИМЕННО при этом угле.
  servo_angle: -80
  # ✅ ПРОВЕРЕНО: get_cv_frame() отдаёт (720, 1080, 3), uint8, BGR.
  frame_width: 1080
  frame_height: 720
  frame_timeout: 5.0
  viewer_name: main_camera
  drain_frames: 0                  # сколько кадров выбросить перед рабочим (анти-лаг).
                                   # Замерить задержку трансляции на борту и поднять,
                                   # если перцепция работает по прошлому

  intrinsics:
    # ⚠️ НЕ ИЗМЕРЕНО. Пока fx/fy пусты, perception/calib.py считает интринсики
    # по zone.fov_h_deg и громко об этом предупреждает: локализация будет
    # работать, но «<30 см» по ней проверять нельзя.
    # Закрывается за 15 минут БЕЗ ПОЛИГОНА: tools/calibrate_camera.py, шахматка,
    # 20-30 кадров. Скрипт печатает готовый блок — вставить сюда целиком.
    # Списки парсер config.py не поддерживает намеренно, поэтому дисторсия
    # разложена по отдельным ключам, а не вектором из пяти чисел.
    fx: 0.0                        # пиксели
    fy: 0.0
    cx: 0.0                        # ноль = взять середину кадра
    cy: 0.0
    k1: 0.0                        # радиальная дисторсия
    k2: 0.0
    p1: 0.0                        # тангенциальная
    p2: 0.0
    k3: 0.0

  mount:
    # Механический перекос крепления камеры, градусы, в осях корпуса. Измеряется
    # ИМЕННО при servo_angle выше и вместе с ним: постоянный наклон камеры входит
    # в R_mount и вычитается формулой, а забытый — уводит все координаты разом.
    # Способ измерить: положить метку на известном расстоянии перед дроном, снять
    # кадр с рабочим углом сервы, подобрать поправки так, чтобы локализация вернула
    # реальные координаты (tools/replay.py покажет расхождение).
    roll: 0.0                      # НЕ ИЗМЕРЕНО
    pitch: 0.0                     # НЕ ИЗМЕРЕНО
    yaw: 0.0                       # НЕ ИЗМЕРЕНО

  attitude:
    # Знаки углов get_orientation() относительно нашей конвенции (localization.py):
    # положительный roll поднимает левый борт, положительный pitch опускает нос.
    # ⚠️ НЕ ПРОВЕРЕНО на нашем борту. Ошибка знака не падает с исключением — она
    # удваивает вклад крена в ошибку координат (~3.5 см на градус). На рабочей
    # высоте дрон летит почти ровно, поэтому пункт 2 это не блокирует.
    # Закрывается на земле: наклонить дрон рукой и сверить знак get_orientation().
    roll_sign: 1                   # НЕ ПРОВЕРЕНО: 1 или -1
    pitch_sign: 1                  # НЕ ПРОВЕРЕНО: 1 или -1

detector:
  # Чем ищем станции:
  #   classic — тёмный прямоугольник на светлом полу, порог Оцу. Работает без
  #             обученной модели и без NPU. Baseline и страховка
  #   yolo    — обученная модель на NPU борта. Основной путь; если она не поднялась,
  #             код сам падает на classic и говорит об этом
  backend: classic
  model: stations                  # имя модели в реестре борта (http://172.17.49.2:7777)
  conf: 0.25                       # порог уверенности YOLO
  nms: 0.45
  img_size: 640                    # вход модели. ОБЯЗАН совпадать с imgsz при обучении
                                   # и при экспорте ONNX (docs/YOLO_TRAINING.md §5)
  # Классы модели по порядку — ровно как в training/classes.txt, через запятую.
  # ⚠️ ЭТО НЕ КОСМЕТИКА. Наш декодер разбирает сырые выходы RKNN ПО ЧИСЛУ КАНАЛОВ
  # (perception/detector.py -> decode_rawbranch): классовая ветка опознаётся как
  # «столько каналов, сколько классов». Лишний или недостающий класс здесь — это
  # не ошибка при загрузке, а молча неверные боксы в полёте.
  # Список списком в этом YAML быть не может: парсер config.py намеренно узкий,
  # поэтому строка через запятую.
  # station_broken пока нет: как выглядит неисправная станция, организаторы не
  # показали, а класс без единого примера сеть выучить не может.
  labels: "ok,dust"
  every_n: 3                       # инференс раз в N кадров. Отрисовка и HUD — каждый
                                   # кадр: трансляция обязана оставаться плавной,
                                   # а инференс дорогой (docs/DRONE_PLAN.md §1.3)
  # ✅ РАЗМЕР СТАНЦИИ ИЗМЕРЕН 01.08.2026 рулеткой на площадке: сверху 29 x 21 см,
  # то есть 0.061 м², вытянутость 1.38. Пороги обязаны бракетировать это число
  # с запасом: слишком узкие потеряют станцию, а «количество обнаруженных
  # соответствует реальному» — условие всех 8 баллов.
  # Площадь считается В МЕТРАХ через высоту и интринсики, а не в пикселях: пиксельный
  # порог поедет с высотой. Ширина вилки — не осторожность вообще, а два конкретных
  # источника ошибки:
  #   1. пока camera.intrinsics не заполнены, масштаб земли берётся из оценки
  #      zone.fov_h_deg=60°. Ошибка угла обзора на 10° меняет ПЛОЩАДЬ примерно
  #      в 1.5 раза — это главный вклад, и он уйдёт после калибровки;
  #   2. сам контур: у края кадра станция видна частично (площадь меньше), а тень
  #      от неё прилипает к маске (площадь больше).
  # Отсюда 0.4x и 2.5x от измеренного. ПОСЛЕ КАЛИБРОВКИ сузить до 0.04-0.10
  # и перепроверить по записи: tools/replay.py --set detector.max_area_m2=0.10
  min_area_m2: 0.025               # 0.4 от измеренных 0.061 м²: меньше — мусор на полу
  max_area_m2: 0.15                # 2.5 от измеренных: больше — тень, разметка или «H»
  aspect_max: 3.0                  # длинная сторона к короткой. У станции 29/21 = 1.38,
                                   # взято с двукратным запасом на перспективу и на
                                   # частично видимый у края кадра контур. Разметка
                                   # трассы вытянута сильнее и отсеивается здесь же
  min_pixels: 200                  # отсев шума до дорогих проверок
  close_px: 9                      # ОТКРЫТИЕ (чистка шума), пиксели. Должно остаться
                                   # мелким: большим ядром съедаются тонкие линии
                                   # сетки, из которых маска панели в основном и состоит
  # ⚠️ ЗАКРЫТИЕ задаётся В МЕТРАХ, и это не педантизм. Панель — тёмные ячейки,
  # разделённые светлыми линиями голографической сетки; от тёмного пола отличаются
  # в основном линии, поэтому маска выходит решёткой с дырами размером в ячейку,
  # и одна станция рассыпается на обрывки. Два обрывка, разошедшиеся дальше
  # fusion.assoc_radius, становятся ДВУМЯ станциями в реестре — это минус 8 баллов
  # ровно так же, как пропущенная станция.
  # Дыру закрывает морфология, но её размер задан ГЕОМЕТРИЕЙ ПАНЕЛИ: ячейка — это
  # сантиметры на земле, а в пикселях она вдвое меньше на вдвое большей высоте.
  # Тот же довод, по которому площадь тут в м², а не в пикселях.
  # 0.06 м — крупнее ячейки панели и втрое меньше зазора между станциями (0.25 м),
  # так что склеить две станции этим нельзя. Если панель всё равно рвётся —
  # поднимать, проверяя tools/handheld.py --set detector.close_m=0.08
  close_m: 0.06                    # ЗАКРЫТИЕ (сшивание обрывков), метры
  # Классический детектор ищет пятно, НЕПОХОЖЕЕ НА ФОН, а не «тёмное».
  # ✅ ПОДТВЕРЖДЕНО фотографиями настоящих станций 01.08.2026 (`фото станции/`):
  # пол ТЁМНО-СЕРЫЙ со светлой разметкой, панель — тёмные ячейки ПЛЮС светлая радужная
  # рамка и сетка между ячейками. То есть станция отклоняется от фона в ОБЕ стороны
  # сразу, и ни dark, ни bright её целиком не возьмут. Оставлено any.
  #   any    — любое отклонение от фона. Наш случай
  #   ⚠️ ложные кандидаты на этом полу, которые видно на тех же фото: белые надписи
  #      и логотип на покрытии (компактные и яркие — площадь их не всегда отсеет),
  #      светлый ковролин по краям площадки (отсеивается по max_area_m2), тень самой
  #      панели (прилипает к маске и раздувает площадь). Разметка трассы и пунктир
  #      вытянуты и уходят по aspect_max. Проверять по записи через tools/replay.py
  #   dark   — только темнее фона
  #   bright — только светлее фона
  polarity: any
  # ⚠️ СНИЖЕН с 6.0 до 2.0 01.08.2026 — прежнее значение делало детектор СЛЕПЫМ,
  # и на заглушке это было не видно. Разбор настоящих фотографий площадки
  # (`фото станции/`, tools/handheld.py --image) показал робастный разброс фона
  # 24-85 уровней яркости вместо почти нуля у заглушки. Порог 6*разброс выходил
  # 142-507 при физическом максимуме отклонения 255: на четырёх снимках из девяти
  # сработать было нельзя в принципе, а на остальных пяти кандидатов вышло ноль.
  # Заглушка показать это не могла: она рисует станции на однородном фоне, где
  # разброс близок к нулю и порог всегда падает на нижнюю границу.
  # ⚠️ 2.0 — ПРОВИЗОРНОЕ значение, выведенное по телефонным снимкам. Подтвердить
  # кадром с камеры дрона: python3 tools/handheld.py (он печатает фон и порог).
  contrast_sigma: 2.0              # во сколько робастных разбросов фона (MAD) должно
                                   # уложиться отклонение, чтобы стать объектом
  contrast_min: 0.10               # но не меньше этой доли диапазона яркости: на
                                   # идеально однородном полу разброс нулевой, и без
                                   # этого «объектом» становится шум матрицы
  contrast_max: 0.5                # и не больше этой доли. Страховка от того самого
                                   # отказа: порог выше 255 означает детектор, который
                                   # не сработает НИКОГДА — ни одной ошибки в логе,
                                   # ни одной детекции. Когда потолок срабатывает,
                                   # детектор кричит об этом в лог. Лишние кандидаты
                                   # ловятся площадью и счётом станций, а молчаливый
                                   # ноль не ловится ничем
  central_frac: 0.5                # в оценку координат идут только наблюдения из
                                   # центральных 50 % кадра (docs/DRONE_PLAN.md §2.2)

fusion:
  # Реестр станций. Условие ВСЕХ 8 баллов подзадачи 2.3.2 — «количество обнаруженных
  # станций соответствует реальному», и оно симметрично: лишняя станция стоит столько
  # же, сколько пропущенная. Отсюда оба порога ниже.
  # ⚠️ СНИЖЕН с 0.40 до 0.20 после замера расстановки 01.08.2026: между КРАЯМИ
  # станций не меньше 25 см, а станция 29 x 21 см, значит между ЦЕНТРАМИ — не меньше
  # 25 + 21 = 46 см (самый тесный случай: станции бок о бок короткими сторонами).
  # Реестр сравнивает именно центры. Со старым порогом 0.40 наблюдения второй станции
  # попадали бы в запись первой — две станции молча становились одной, и это минус
  # все 8 баллов. Порог зажат с двух сторон:
  #   сверху  половина минимального расстояния между центрами (46 -> 23 см), иначе
  #           склейка. Взято 20 см, то есть с запасом;
  #   снизу   разброс ОДНОГО наблюдения, иначе одна станция расколется на две записи —
  #           цена ровно та же. Медиана даёт <10 см, отдельное наблюдение хуже.
  # Проверено в заглушке на самом тесном случае (центры 25 см — предел, при котором
  # станции ещё не перекрываются): 2 станции, координаты в пределах сантиметра.
  # Проверять ОБЯЗАТЕЛЬНО и по настоящей записи (tools/replay.py): число станций
  # в «Итоговом реестре» должно совпасть с расстановкой. Раскол лечится подъёмом
  # confirm_obs, склейка — только снижением порога.
  assoc_radius: 0.20               # м: ближе этого — то же самое, дальше — новая станция
  # ⚠️ ЗАЩИТА ОТ РАСКОЛА, добавлена 01.08.2026 после того, как одна станция иногда
  # приходила как две. Физический минимум между ЦЕНТРАМИ двух разных станций:
  # 25 см между краями плюс 21 см самой станции = 46 см (замер 01.08.2026).
  # Между assoc_radius и этим числом лежит МЁРТВАЯ ЗОНА: наблюдение слишком далеко,
  # чтобы уточнять координату, но ближе, чем вторая станция может стоять физически.
  # Раньше по такому наблюдению заводилась новая запись — одна станция становилась
  # двумя. Теперь оно засчитывается соседу как ГРУБОЕ: станцию подтверждает,
  # координату не портит. Сколько раз сработало — видно в итоге прогона.
  # 0.40 вместо 0.46 — запас на случай, если где-то станции стоят чуть теснее.
  # 0 выключает защиту.
  min_separation: 0.40             # м: ближе этого двух станций не бывает
  confirm_obs: 3                   # сколько наблюдений до отправки station_new.
                                   # Защита от одиночного ложного срабатывания
  max_obs: 60                      # окно наблюдений на станцию: за длинный полёт
                                   # позиция дрейфует, и старые точки тянут медиану
  status_min_conf: 0.6             # ниже — голоса поделились почти поровну, и слать
                                   # status_update значит мигать статусом на карте
  resend_moved: 0.10               # м: переслать station_new, если уточнённая медиана
                                   # уехала дальше. Первый пакет уходит после трёх
                                   # наблюдений (реальное время — условие 8 баллов),
                                   # но оценивают нас по ИТОГОВОЙ точке на карте,
                                   # а медиана двадцати наблюдений заметно точнее.
                                   # Хаб и визуализатор ведут станции по id, поэтому
                                   # повтор уточняет запись, а не плодит новую.
                                   # 0 — выключить переотправку
  max_stations: 12                 # больше, чем бывает на полигоне (регламент: 3-5).
                                   # Превышение = детектор сыпет ложными, и плодить
                                   # записи молча нельзя

flight:
  h_survey: 1.5                    # рабочая высота облёта, м. Для трассы 2x3 м этого
                                   # достаточно и запас по оптопотоку (0.06-4 м) больше.
                                   # Для змейки по большой зоне поднять до 2.0
  speed: 0.45                      # м/с: при 10 FPS даёт >=20 кадров на станцию
  h_min: 0.35                      # ЖЁСТКИЙ ПОЛ: команда ниже не уходит в автопилот.
                                   # Единственная защита от касания панели (подзадача 2.3.4,
                                   # сломанное оборудование не заменяется)
  h_max: 2.5                       # выше оптопоток срывается
  # ⚠️ ПОРОГИ ПОДНЯТЫ 31.07.2026. check_sdk.py показал на покоящемся борту 8.2 В —
  # это батарея 2S (7.4 В номинал, 8.4 В заряженная), а не 1S из документации Geoscan.
  # Со старыми порогами 6.6/6.2 (это 3.3 и 3.1 В на банку) защита не сработала бы
  # никогда: дрон упал бы раньше. Сейчас 3.5 и 3.3 В на банку.
  # УТОЧНИТЬ по логам первых полётов: снять напряжение в момент, когда дрон реально
  # начинает проседать, и поставить порог на 0.2 В выше.
  batt_low: 7.0                    # В: порог аварийного возврата
  batt_critical: 6.6               # В: немедленная посадка
  point_timeout: 25.0              # с на перелёт между точками
  settle: 1.0                      # с паузы после прихода в точку
  arm_settle: 3.0                  # arm(timeout=5) сам по себе стоит ~5 с
  takeoff_settle: 3.0

route:
  # Форма маршрута:
  #   loop   — обход трассы по четырём угловым точкам вокруг площадки (секция loop)
  #   survey — змейка построчно по прямоугольной зоне (секция zone)
  #   rect   — прямоугольник ОТ ТОЧКИ ВЗЛЁТА: вперёд, вбок, назад, обратно (секция rect)
  # ⚠️ ПЕРЕКЛЮЧЕНО на rect 01.08.2026 (вторая правка за день): расстановка снова
  # сменилась, облетать надо прямоугольник 4.4 м вперёд x 1.5 м влево с началом
  # и концом на площадке. Змейка (survey) по зоне 4.6 x 6.7 относилась к ПРЕДЫДУЩЕЙ
  # расстановке и увела бы дрон не туда; её секция zone ниже оставлена как есть,
  # но при route.mode: rect не читается — кроме zone.fov_h_deg, по которому
  # проверяется, влезает ли короткая сторона в полосу обзора.
  mode: rect

loop:
  # Габариты трассы: дрон обходит её по четырём углам и замыкает круг.
  # Мерить по внешней белой линии овала рулеткой перед попыткой (регламент 2.5:
  # маршрут строится под фактическую расстановку, а не под вчерашнюю).
  length: 2.7                      # НЕ ПРОВЕРЕНО: размер вдоль X (вперёд), м
  width: 1.7                       # НЕ ПРОВЕРЕНО: размер вдоль Y (влево), м
  # Центр контура относительно точки взлёта. Ноль = площадка «H» в середине овала.
  # Если H смещена от центра, замерить сдвиг и вписать сюда со знаком.
  center_x: -0.4                    # НЕ ПРОВЕРЕНО
  center_y: 0.0                    # НЕ ПРОВЕРЕНО
  margin: 0.0                      # раздвинуть контур наружу, м. Отрицательное значение
                                   # заводит маршрут внутрь овала, подальше от сетки
  direction: ccw                   # ccw — против часовой сверху, cw — по часовой
  laps: 1                          # сколько кругов подряд
  use_packet_zone: false           # брать габариты из пакета takeoff вместо этих.
                                   # Выключено: трассу меряем мы, автомобиль её не знает

rect:
  # Используется только при route.mode: rect (с 01.08.2026 это основной режим).
  # ✅ ЗАДАНО ПО ПЛОЩАДКЕ 01.08.2026: дрон стоит в углу прямоугольника, облёт идёт
  # вперёд на length, влево на width, назад на length и вправо обратно на площадку.
  # Точка взлёта — И ПЕРВЫЙ, И ПОСЛЕДНИЙ угол, поэтому после облёта дрон уже дома
  # и RETURN только подтверждает позицию.
  # Мерить перед каждой попыткой: это параметр расстановки, а не константа
  # (регламент 2.5). Проверить, не поднимая дрон:
  #   $env:PIONEER_MOCK="1"; python "квадрокоптер/main.py" --manual --no-camera --no-hub
  # в выводе будет «прямоугольник: 4 точки, путь 11.8 м».
  length: 4.4                      # м ВПЕРЁД (вдоль нашего X)
  width: 1.5                       # м ВБОК (вдоль нашего Y)
  # В какую сторону уходит короткая сторона: left (наш +Y) или right (−Y).
  # Самая дорогая ошибка в секции: right увёл бы весь облёт на 1.5 м в зеркальную
  # сторону от площадки. Наша СК: X вперёд, Y ВЛЕВО.
  side: left
  # Где стоит дрон относительно нуля СК. Ноль фиксируется в arm(), то есть ровно
  # на площадке «H», и сдвигать его незачем — оставлено на случай, если взлетать
  # придётся не из угла прямоугольника.
  start_x: 0.0
  start_y: 0.0
  # ⚠️ ЧТО ЭТОТ МАРШРУТ НЕ ЗАКРЫВАЕТ. Длинные проходы идут по краям прямоугольника,
  # то есть по y=0 и y=1.5. Полоса обзора на h_survey=1.5 м при fov 60° — 1.73 м,
  # значит середина (y≈0.75) в кадр попадает, но только КРАЕМ: в оценку координат
  # идут центральные 50 % кадра (detector.central_frac), а это ±0.43 м от линии
  # прохода. Станция посередине найдётся и посчитается, но её координата будет
  # держаться на грубых наблюдениях — риск для 4 баллов за «<30 см», не для 8 за счёт.
  # survey.py об этом ПРЕДУПРЕЖДАЕТ при старте, это не сбой. Лечится либо третьим
  # проходом посередине (режим survey по зоне 4.4 x 1.5), либо высотой 2.6 м —
  # а она выше flight.h_max. Оставлено как есть: маршрут задан оператором.

zone:
  # Размеры зоны используются только при route.mode: survey (сейчас включён rect,
  # см. секцию выше), но zone.fov_h_deg читается ВСЕГДА — по нему считается полоса
  # обзора и площадь объекта в м².
  # ⚠️ ЗОНА 4.6 x 6.7 ОТНОСИТСЯ К ПРЕДЫДУЩЕЙ РАССТАНОВКЕ (утро 01.08.2026). Оставлена
  # на случай возврата к змейке; перед включением route.mode: survey перемерить.
  # Размеры зоны облёта — параметр попытки, а не константа. Переснимать перед каждой
  # попыткой.
  # ⚠️ ПЕРЕПИСАНЫ 01.08.2026 ПОД ПРЕДЫДУЩУЮ ПЛОЩАДКУ: прямоугольник 4.6 x 6.7 м,
  # 4.6 м — ВПЕРЁД от дрона (вдоль X), 6.7 м — ВЛЕВО (вдоль Y). Дрон взлетает
  # в ближнем ПРАВОМ углу, поэтому зона целиком лежит вперёд и влево от него:
  #     x от 0.0 до 4.6, y от 0.0 до 6.7  ->  center_x 2.3, center_y 3.35.
  # Секция loop (2.7 x 1.7) осталась от ПРЕДЫДУЩЕЙ площадки и к этой не относится —
  # при route.mode: survey она не читается вообще, но если понадобится вернуть контур,
  # её габариты придётся перемерить.
  # ЧТО НАДО ЗАМЕРИТЬ: не трассу, а РАЗБРОС СТАНЦИЙ. Взять самую дальнюю станцию
  # в каждую сторону от точки взлёта и ПРИБАВИТЬ 0.4 м С КАЖДОЙ СТОРОНЫ. Прибавка
  # обязательна и не про запас: крайние полосы змейки вдвинуты внутрь зоны на половину
  # полосы обзора (survey.py -> _line_positions), а в оценку координат идут только
  # наблюдения из центральных 50 % кадра (detector.central_frac). Станция у самой
  # границы объявленной зоны накрывается камерой, но в ЦЕНТР кадра не попадает ни разу,
  # и её координата держится на худших наблюдениях — в логе это «ВНИМАНИЕ: только
  # по краю кадра», а на табло это 4 балла за «<30 см». Высотой не лечится, проверено
  # в заглушке 01.08.2026: на 1.0 м полос становится больше, но крайние станции
  # остаются краевыми; расширение зоны на 0.4 м убирает пометку у всех.
  # Зона меньше разброса = потерянная станция = все 8 баллов; зона больше нужного
  # стоит только времени полёта (лишняя полоса змейки — это секунды). Проверить,
  # не поднимая дрон:
  #   $env:PIONEER_MOCK="1"; python "квадрокоптер/main.py" --manual --no-camera --no-hub
  # в выводе будет «змейка: N полос, шаг ..., путь ... м» — сверить с площадкой.
  # ⚠️ Прибавки 0.4 м ЗДЕСЬ НЕТ: 4.6 x 6.7 — это размеры, названные по площадке, и
  # раздувать их самовольно нельзя, дрон уйдёт за её границу. Следствие: станция,
  # стоящая вплотную к краю прямоугольника, получит пометку «только по краю кадра».
  # Если такие есть — либо прибавить по 0.4 м к той стороне, где они стоят (проверив,
  # что место есть), либо опустить margin ниже.
  width: 4.6                       # м вдоль X (вперёд): длина одного прохода змейки
  height: 6.7                      # м вдоль Y (влево): поперёк этой стороны идёт сдвиг
  margin: 0.4                      # отступ от границы зоны, м. Вдоль прохода вычитается
                                   # с обоих концов: рабочий проход выходит 4.6-0.8=3.8 м,
                                   # края прямоугольника добирает камера
  # Перекрытие соседних полос. ПОДНЯТО с 0.3 до 0.5 под правило центральных 50 %
  # кадра (detector.central_frac): в оценку координат идут только наблюдения из
  # середины кадра, значит рабочая ширина полосы — половина полного следа камеры,
  # и при 0.3 между полосами оставались бы коридоры, где станцию видно только с краю.
  # Она там не потеряется (грубые наблюдения тоже считаются, см. fusion.py), но
  # координата будет держаться на худших наблюдениях — а это 4 балла.
  # Цена: змейка примерно на 40 % длиннее.
  overlap: 0.5
  fov_h_deg: 60.0                  # НЕ ПРОВЕРЕНО: горизонтальный угол обзора камеры.
                                   # Считается из интринсик после калибровки (пункт 2)
  # Вдоль какой оси идут проходы: auto | x | y.
  # ⚠️ ЗАДАНО ЯВНО x 01.08.2026. auto выбирает длинную сторону (меньше разворотов),
  # то есть при 4.6 x 6.7 повёл бы проходы вдоль Y — по 6.7 м вбок. Нужен обратный
  # порядок: проход ВПЕРЁД на 4.6 м, сдвиг вбок, снова вперёд. Ценой лишних разворотов.
  strip_axis: x
  # Центр зоны относительно точки взлёта. Если параметр не задан, центр смещается
  # вперёд на полширины — дрон стартует у ближнего края зоны. Здесь задан явно:
  # дрон в ближнем ПРАВОМ углу прямоугольника, значит зона уходит вперёд на всю
  # длину (центр на 4.6/2) и влево на всю ширину (центр на 6.7/2).
  # Знак center_y — самая дорогая ошибка в этой секции: минус увёл бы змейку
  # на 6.7 м ВПРАВО от площадки. Наша СК: X вперёд, Y ВЛЕВО.
  center_x: 2.3                    # 4.6 / 2
  center_y: 3.35                   # 6.7 / 2, влево

map:
  # Привязка карты визуализатора. Пример организаторов (source/2_step/MapExample.py)
  # рисует станции в ПИКСЕЛЯХ картинки полигона и координаты их просто захардкодил;
  # у нас они приходят от дрона в метрах, поэтому нужна привязка.
  #
  # Как измерить, один раз на площадке (10 минут, полигон не нужен):
  #   1. взять на картинке две точки с известным расстоянием между ними — например,
  #      углы посадочной площадки или ширину трассы, — и поделить пиксели на метры;
  #   2. отметить пиксель, в котором на картинке стоит дрон в момент взлёта;
  #   3. если ось X дрона (вперёд по курсу старта) не смотрит вверх по картинке —
  #      вписать поворот в градусах, против часовой.
  image: "assets/map.jpg"          # относительно распределительный хаб/
  # ✅ ИЗМЕРЕНО 01.08.2026 по картинке 1188x900.
  px_per_m: 148.0                  # 74 пикселя на 0.5 м -> 74 / 0.5
  origin_px_x: 998                 # пиксель, в котором дрон стоит в момент взлёта
  origin_px_y: 701
  # Поворот карты относительно курса старта, градусы, против часовой.
  # Ноль означает: ось X дрона (ВПЕРЁД по курсу взлёта) смотрит ВВЕРХ по картинке,
  # а ось Y (ВЛЕВО) — влево по картинке. Именно этот случай и замерен: дрон на карте
  # смотрит вверх.
  # Проверка сходимости: зона 4.6 x 6.7 от точки взлёта ложится в прямоугольник
  # пикселей (6..998, 20..701) — целиком внутри картинки, углом в измеренную точку.
  # Если бы не сходилось, ошибка была бы либо в масштабе, либо в этом угле.
  yaw_deg: 0.0

mission:
  src: drone
  # Какая подзадача регламента сдаётся. Профили — в квадрокоптер/tasks.py, здесь только
  # выбор; ключ --task у main.py и launch.py перекрывает это значение.
  #   2.3.1  взлёт по команде, облёт, посадка. Детекции нет вообще
  #   2.3.2  + обнаружение станций, station_new и recon_done
  #   2.3.3  + отправка status_update
  #   2.3.4  наведение на запылённую станцию (задел пункта 4, манёвр ещё не написан)
  # ⚠️ УМОЛЧАНИЕ ПЕРЕКЛЮЧЕНО на 2.3.2 (01.08.2026). Прежнее (2.3.1) держалось до тех
  # пор, пока пункт 1 не проверен полётом; он сдан 01.08.2026, а следующая попытка —
  # 2.3.2. Цена забытого ключа --task теперь несимметрична: с task 2.3.1 дрон пролетит
  # змейку КРАСИВО И БЕЗ ЕДИНОЙ ДЕТЕКЦИИ (профиль 2.3.1 не создаёт ни детектора,
  # ни реестра), станций придёт ноль, и это ноль из 8 баллов при внешне нормальном
  # полёте. Обратная ошибка дешевле: лишняя детекция в попытке 2.3.1 баллов не отнимает.
  task: "2.3.2"
  manual_start: false              # true — не ждать пакет takeoff (отладка без хаба)
  telemetry_hz: 2.0
  survey_timeout: 420.0            # с на весь облёт
  return_timeout: 90.0
  land_timeout: 45.0
  record: true
  # Записи попыток лежат отдельной папкой, а не в корне: за один день их набегает
  # два десятка пар mp4+jsonl, и корень репозитория переставал читаться. Путь
  # относительный, то есть на борту это /home/pioneermini/workspace/records —
  # оттуда их и забирает launch.py --fetch. Имя латиницей намеренно: cv2.VideoWriter
  # на Windows молча не открывает файл по пути с кириллицей (та же беда, что у
  # cv2.imread, ради которой написан tools/imgio.py).
  record_dir: "records"
  record_fps: 15
  # Что писать в видео: сырой кадр с камеры (true) или тот же кадр с рамками
  # детектора и полосой HUD (false).
  # ⚠️ ДОЛЖНО ОСТАВАТЬСЯ true. Запись — единственный источник кадров для обучения
  # модели (docs/YOLO_TRAINING.md §2), а рамки и HUD в кадре сеть выучит как признак
  # станции: она увидит зелёный прямоугольник ровно там, где ей и говорят «станция».
  # Разбирать полёт глазами это не мешает: tools/replay.py рисует разметку поверх
  # записи заново и любыми порогами, а вот выкинуть впечатанные рамки нельзя ничем.
  record_raw: true
